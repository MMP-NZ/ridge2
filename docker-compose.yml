services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ridge_dev
      TZ: Pacific/Auckland
    ports:
      - "5432:5432"
    volumes:
      - ridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ridge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridge_postgres_data:
